[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "acelight"
version = "0.0.0a1"
authors = [
  { name="Tor K. Gjerde", email="tor@ace-high.com" },
]

description = "Python client for the AceLight CAN protocol"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "python-can[serial]>=4.6.1,<5"
]

[project.urls]
Homepage = "https://ace-high.com"

[tool.setuptools.packages.find]
where = ["src"]
include = ["acelight", "acelight.*"]